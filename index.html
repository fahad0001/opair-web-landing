  <script>
    // Robustly remove `#social-proof` and `/developers` links even after client-side re-render
    (function removeSocialProof() {
      function remove() {
        try {
          const el = document.getElementById('social-proof');
          if (el) {
            el.remove();
            return true;
          }
          const anchors = document.querySelectorAll('a[href="/developers"]');
          if (anchors.length) anchors.forEach(n => n.remove());
        } catch (e) { }
        return false;
      }

      if (remove()) return;

      const obs = new MutationObserver(() => {
        if (remove()) obs.disconnect();
      });
      obs.observe(document.documentElement, { childList: true, subtree: true });

      const id = setInterval(() => {
        if (remove()) { clearInterval(id); obs.disconnect(); }
      }, 200);
    })();
  </script>
